# =================================================================
# OS Privacidad — Docker Compose (producción-ready, dev-friendly)
# =================================================================
# Servicios: db (PostgreSQL 16), redis (Redis 7), api (FastAPI),
#            web (Next.js 15), nginx (reverse proxy)
# =================================================================

services:
  # ── PostgreSQL 16 ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osprivacidad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-osprivacidad}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5434:5432"   # 5434 en host para evitar conflicto con PG local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osprivacidad} -d ${POSTGRES_DB:-osprivacidad}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend

  # ── Redis 7 ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"   # 6380 en host para evitar conflicto con Redis local
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend

  # ── FastAPI (Backend API) ──────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://osprivacidad:changeme@db:5432/osprivacidad}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_ACCESS_EXPIRE_MINUTES=${JWT_ACCESS_EXPIRE_MINUTES:-15}
      - JWT_REFRESH_EXPIRE_DAYS=${JWT_REFRESH_EXPIRE_DAYS:-7}
      - API_ENV=${API_ENV:-development}
      - API_DEBUG=${API_DEBUG:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://localhost"]}
    volumes:
      - ./apps/api:/app
      - /app/.venv              # Preservar venv del build (no sobrescribir con bind mount)
    ports:
      - "127.0.0.1:8000:8000"   # Solo localhost — Nginx es el entry point
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/api/v1/health'); exit(0 if r.status_code == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend
      - frontend

  # ── Next.js 15 (Frontend) ─────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1
      - NODE_ENV=development
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3000:3000"   # Solo localhost
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend

  # ── Nginx (Reverse Proxy) ─────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - frontend
      - backend

volumes:
  pgdata:
    driver: local

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
