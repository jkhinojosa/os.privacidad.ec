[project]
name = "os-privacidad-api"
version = "0.1.0"
description = "OS Privacidad — API Backend para gestión de privacidad y protección de datos personales"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # ── Framework ──
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    # ── Database ──
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # ── Config & Validation ──
    "pydantic-settings>=2.6",
    "email-validator>=2.0",
    # ── Auth ──
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0",
    # ── Cache ──
    "redis[hiredis]>=5.0",
    # ── HTTP Client ──
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "httpx",           # para TestClient async
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
]
ignore = [
    "S101",  # assert usado en tests
    "S104",  # binding 0.0.0.0
    "S105",  # hardcoded password binding (falsos positivos en config)
    "S106",  # hardcoded token_type
    "B008",  # Depends() en defaults de parámetros de FastAPI
    "E501",  # Longitud de línea manejada por ruff format
]

[tool.ruff.lint.isort]
known-first-party = ["core", "db", "models", "schemas", "routers", "ai", "integrations", "jobs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["core", "db", "models", "schemas", "routers", "ai", "integrations", "jobs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
